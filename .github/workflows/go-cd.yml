name: Reusable Go CD for ArgoCD and Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment (dev, staging, prod)
        required: true
        type: string
      repository_path:
        description: Docker repository path per environment
        required: true
        type: string
      dockerfile:
        description: Dockerfile path
        required: false
        default: "Dockerfile"
        type: string
      context:
        description: Docker build context
        required: false
        default: "."
        type: string
      image_tag:
        description: Docker image tag
        required: false
        default: ""
        type: string

jobs:
  cd-process:
    name: Build and push docker image to Docker Hub
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-go-cd-process-${{ github.ref }}
      cancel-in-progress: true

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: docker build -f "${{ inputs.dockerfile }}" -t temp "${{ inputs.context }}"

      - name: Tag and Push to Docker Hub
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          IMAGE_LATEST="${{ inputs.repository_path }}:${TAG}"
          docker tag temp "$IMAGE_LATEST"
          docker push "$IMAGE_LATEST"
